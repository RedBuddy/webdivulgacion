<div class="contacto-mensaje-container">
  <h1>Enviar Mensaje de Contacto</h1>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="subject">Asunto:</label>
      <input id="subject" formControlName="subject" type="text" placeholder="Ingrese el asunto">
      <div *ngIf="contactForm.get('subject')?.invalid && contactForm.get('subject')?.touched" class="error-message">
        El asunto es requerido.
      </div>
    </div>

    <div class="form-group">
      <label for="message">Mensaje:</label>
      <textarea id="message" formControlName="message" rows="5" placeholder="Ingrese su mensaje"></textarea>
      <div *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched" class="error-message">
        El mensaje es requerido y debe tener al menos 10 caracteres.
      </div>
    </div>

    <button type="submit" [disabled]="contactForm.invalid">Enviar</button>
  </form>

  <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="error-message"><i class="bi bi-exclamation-triangle-fill"></i> {{ errorMessage }}
  </div>
</div>
