<div class="modal" *ngIf="isVisible()">
  <div class="modal-content">
    <span class="close" (click)="close()">&times;</span>
    <form (ngSubmit)="login()">
      <div class="campo">
        <label for="identifier">Usuario o Email:</label>
        <input type="text" id="identifier" [(ngModel)]="identifier" name="identifier" required>
      </div>

      <div class="campo">
        <label for="password">Contraseña:</label>
        <div class="password-container">
          <input [type]="showPassword() ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password"
            required>
          <button type="button" class="btn-eye" (click)="togglePasswordVisibility()">
            <i class="bi" [ngClass]="showPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Mostrar el mensaje de error si existe -->
      <div *ngIf="errorMessage" class="error-message"><i class="bi bi-exclamation-triangle-fill"></i> {{ errorMessage }}
      </div>

      <button class="btn-login" type="submit">Iniciar Sesión</button>
    </form>
  </div>
</div>
