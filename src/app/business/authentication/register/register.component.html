<div class="modal" *ngIf="isVisible()">
  <div class="modal-content">
    <span class="close" (click)="close()">&times;</span>
    <h2 class="titulo">Registrarse</h2>
    <form (ngSubmit)="register()">
      <div class="campo">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" required>
      </div>

      <div class="campo">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required>
      </div>

      <div class="campo">
        <label for="first_name">Nombre</label>
        <input type="text" id="first_name" [(ngModel)]="first_name" name="first_name" required>
      </div>

      <div class="campo">
        <label for="last_name">Apellido</label>
        <input type="text" id="last_name" [(ngModel)]="last_name" name="last_name" required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="password-container">
          <input [type]="showPassword() ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password"
            required>
          <button type="button" class="btn-eye" (click)="togglePasswordVisibility()">
            <i class="bi" [ngClass]="showPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="campo">
        <label for="confirm_password">Confirmar Contraseña</label>
        <div class="password-container">
          <input [type]="showPassword() ? 'text' : 'password'" id="confirm_password" [(ngModel)]="confirm_password"
            name="confirm_password" required>
          <button type="button" class="btn-eye" (click)="togglePasswordVisibility()">
            <i class="bi" [ngClass]="showPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="campo">
        <label for="profile_img">Subir Imagen de Perfil</label>
        <input type="file" id="profile_img" accept="image/*" (change)="onFileSelected($event)">
      </div>

      <div class="campo">
        <input type="checkbox" id="terms" [(ngModel)]="termsAccepted" name="terms" required>
        <label for="terms">Acepto los términos y condiciones</label>
      </div>

      <button type="submit" [disabled]="!termsAccepted || password !== confirm_password">Registrarse</button>
    </form>
  </div>
</div>
