<div class="container mt-5">
  <h2>Registro</h2>
  <form>
    <!-- Subir imagen de perfil -->
    <div class="form-group">
      <label for="profileImage">Subir imagen de perfil</label>
      <input type="file" class="form-control-file" id="profileImage">
    </div>

    <!-- Usuario -->
    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" class="form-control" id="username" placeholder="Ingrese su usuario">
    </div>

    <!-- Nombres -->
    <div class="form-group">
      <label for="firstName">Nombres</label>
      <input type="text" class="form-control" id="firstName" placeholder="Ingrese sus nombres">
    </div>

    <!-- Apellidos -->
    <div class="form-group">
      <label for="lastName">Apellidos</label>
      <input type="text" class="form-control" id="lastName" placeholder="Ingrese sus apellidos">
    </div>

    <!-- País -->
    <div class="form-group">
      <label for="country">País</label>
      <input type="text" class="form-control" id="country" placeholder="Ingrese su país">
    </div>

    <!-- Correo -->
    <div class="form-group">
      <label for="email">Correo</label>
      <input type="email" class="form-control" id="email" placeholder="Ingrese su correo">
    </div>

    <!-- Contraseña -->
    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="input-group">
        <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña"
          [(ngModel)]="password" name="password">
        <div class="input-group-append">
          <span class="input-group-text password-toggle" (click)="togglePasswordVisibility('password')">
            <i [ngClass]="{'fa-eye': !showPassword, 'fa-eye-slash': showPassword}" class="fas"></i>
          </span>
        </div>
      </div>
    </div>

    <!-- Confirmar Contraseña -->
    <div class="form-group">
      <label for="confirmPassword">Confirmar Contraseña</label>
      <div class="input-group">
        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirme su contraseña"
          [(ngModel)]="confirmPassword" name="confirmPassword">
        <div class="input-group-append">
          <span class="input-group-text password-toggle" (click)="togglePasswordVisibility('confirmPassword')">
            <i [ngClass]="{'fa-eye': !showConfirmPassword, 'fa-eye-slash': showConfirmPassword}" class="fas"></i>
          </span>
        </div>
      </div>
    </div>

    <!-- Acepto los términos -->
    <div class="form-group form-check">
      <input type="checkbox" class="form-check-input" id="terms">
      <label class="form-check-label" for="terms">Acepto los términos y condiciones</label>
    </div>

    <!-- Botón de registro -->
    <button type="submit" class="btn btn-primary">Registrarse</button>
  </form>
</div>
